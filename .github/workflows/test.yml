name: Test

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            # Unit tests for the facts schema and parser
            - run: npm test

            # The committed snippet must match what the generator produces
            - run: npm run snippet:check

            # Seed data must produce valid facts blocks (no network needed)
            - run: node scripts/seed.mjs --dry-run

            # Ghost's official theme validator
            - run: npm run gscan

            # The theme zip must build
            - run: npm run pack

    deploy-files:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            # The Docker stack must parse with the example settings
            - name: Validate docker-compose.yml
              working-directory: deploy
              run: |
                  cp .env.example .env
                  docker compose config --quiet

            # The Caddyfile must be valid
            - name: Validate Caddyfile
              working-directory: deploy
              run: |
                  docker run --rm -e DOMAIN=harness.example.com \
                      -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
                      caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
